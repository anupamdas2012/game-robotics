name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble dist (root = The Robot Engine; B/C/D/E variants)
        run: |
          mkdir -p dist
          cp -R v8-letterhop/. dist/
          mkdir -p dist/b dist/c dist/d dist/e
          cp -R v3-robotfirst/. dist/b/
          cp -R v4-prototype/.  dist/c/
          cp -R v5-substrate/.  dist/d/
          cp -R v6-sim2real/.   dist/e/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
