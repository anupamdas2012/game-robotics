<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Robot Engine — experiment</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%97%89%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <h1 class="rk">
      <span class="rk-line"><span class="rk-word">THE</span></span>
      <span class="rk-line"><span class="rk-word">ROBOT</span></span>
      <span class="rk-line"><span class="rk-word">ENGINE</span></span>

      <!-- pixel-art robot (crisp, no anti-aliasing) -->
      <div class="robot" aria-hidden="true">
      <svg class="robot-sprite" viewBox="0 0 18 18" shape-rendering="crispEdges">
        <!-- antenna -->
        <rect x="8" y="0" width="2" height="2" fill="#FFD23E"/>
        <rect x="8" y="2" width="2" height="1" fill="#0A0A0A"/>
        <!-- head: ink outline + teal face -->
        <rect x="4" y="3" width="10" height="8" fill="#0A0A0A"/>
        <rect x="5" y="4" width="8" height="6" fill="#0FB5A6"/>
        <!-- eyes -->
        <rect x="6" y="6" width="2" height="2" fill="#FFFFFF"/>
        <rect x="10" y="6" width="2" height="2" fill="#FFFFFF"/>
        <rect x="7" y="7" width="1" height="1" fill="#0A0A0A"/>
        <rect x="11" y="7" width="1" height="1" fill="#0A0A0A"/>
        <!-- mouth -->
        <rect x="7" y="9" width="4" height="1" fill="#0A0A0A"/>
        <!-- arms -->
        <rect x="2" y="11" width="2" height="3" fill="#0A0A0A"/>
        <rect x="14" y="11" width="2" height="3" fill="#0A0A0A"/>
        <!-- body: ink outline + teal + yellow light -->
        <rect x="5" y="11" width="8" height="5" fill="#0A0A0A"/>
        <rect x="6" y="12" width="6" height="3" fill="#0FB5A6"/>
        <rect x="8" y="13" width="2" height="1" fill="#FFD23E"/>
        <!-- feet -->
        <rect x="6" y="16" width="2" height="2" fill="#0A0A0A"/>
        <rect x="10" y="16" width="2" height="2" fill="#0A0A0A"/>
      </svg>
      </div>
    </h1>
  </main>

  <script>
    (function () {
      var robot = document.querySelector('.robot');
      var words = Array.prototype.slice.call(document.querySelectorAll('.rk-word'));
      if (!robot || words.length < 3) return;
      var anim = null;

      function tf(p, r) {
        return 'translate(' + p.x + 'px,' + p.y + 'px) rotate(' + r + 'deg)';
      }

      function build() {
        if (anim) { anim.cancel(); anim = null; }
        var rh = robot.offsetHeight;
        var gap = Math.max(14, robot.offsetWidth * 0.32);
        var pts = words.map(function (w) {
          return {
            x: w.offsetLeft + w.offsetWidth + gap,
            y: w.offsetTop + w.offsetHeight / 2 - rh / 2
          };
        });
        var jump = Math.max(70, rh * 1.25);
        function apex(a, b) { return { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - jump }; }
        var a01 = apex(pts[0], pts[1]), a12 = apex(pts[1], pts[2]), a20 = apex(pts[2], pts[0]);

        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          robot.style.transform = tf(pts[0], 0);
          return;
        }

        var kf = [
          { transform: tf(pts[0], 0),     offset: 0.00, easing: 'ease-in' },
          { transform: tf(pts[0], 0),     offset: 0.10, easing: 'ease-in' },
          { transform: tf(a01, -180),     offset: 0.20, easing: 'ease-out' },
          { transform: tf(pts[1], -360),  offset: 0.30, easing: 'ease-in' },
          { transform: tf(pts[1], -360),  offset: 0.43, easing: 'ease-in' },
          { transform: tf(a12, -540),     offset: 0.53, easing: 'ease-out' },
          { transform: tf(pts[2], -720),  offset: 0.63, easing: 'ease-in' },
          { transform: tf(pts[2], -720),  offset: 0.76, easing: 'ease-in' },
          { transform: tf(a20, -900),     offset: 0.87, easing: 'ease-out' },
          { transform: tf(pts[0], -1080), offset: 1.00 }
        ];
        anim = robot.animate(kf, { duration: 4400, iterations: Infinity });
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(build);
      }
      build();
      var t;
      window.addEventListener('resize', function () {
        clearTimeout(t);
        t = setTimeout(build, 150);
      });
    })();
  </script>
</body>
</html>
